services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dewy-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/dewy.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CHANNEL_SERVICE_URL=http://channel-service:8001
    volumes:
      - backend-data:/app/data
    depends_on:
      - channel-service
    restart: always

  channel-service:
    build:
      context: ./channel-service
      dockerfile: Dockerfile
    container_name: dewy-channel-service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=sqlite:////app/data/channel_service.db
      - CRM_CALLBACK_URL=http://backend:8000/api/receipts
      - CALLBACK_TIMEOUT_SECONDS=10
      - DELIVERED_DELAY_SECONDS=2
      - OPENED_DELAY_SECONDS=5
      - READ_DELAY_SECONDS=8
      - CLICKED_DELAY_SECONDS=12
    volumes:
      - channel-data:/app/data
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: dewy-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: always

volumes:
  backend-data:
    driver: local
  channel-data:
    driver: local
